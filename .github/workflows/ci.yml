name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...

  ts-integration:
    name: TypeScript integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: genclient/testdata/tstest/package-lock.json
      - name: Install TypeScript toolchain
        working-directory: genclient/testdata/tstest
        run: npm ci
      - run: go test -tags tsintegration -run 'TestGoldenClientsTypeCheck|TestGeneratedClientRuntime' ./genclient/

  examples:
    name: Example (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [error-body, inertiajs, simple-registry, todo]
    defaults:
      run:
        working-directory: _example/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: _example/${{ matrix.example }}/go.sum
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./...
